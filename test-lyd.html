<!doctype html><html lang="no"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arctic AI Guide – lydtest</title><style>body{font:17px system-ui;background:#081b2c;color:#fff;padding:22px}button{display:block;width:100%;padding:18px;margin:14px 0;background:#3ce3bd;color:#002b2a;border:0;border-radius:14px;font-size:18px}pre{white-space:pre-wrap;background:#173449;padding:16px;border-radius:12px;overflow-wrap:anywhere}</style><h2>Arctic AI Guide – lydtest</h2><p>Skru opp medievolumet. Trykk først på pipelyd og deretter på norsk tale.</p><button id="beep">1. Spill pipelyd</button><button id="nor">2. Test norsk stemme</button><button id="eng">3. Test engelsk stemme</button><button id="ger">4. Test tysk stemme</button><button id="chi">5. Test kinesisk stemme</button><pre id="log">Klar til test.</pre><script>const out=document.querySelector('#log');function log(t){out.textContent+='\n'+t}function voices(){return speechSynthesis.getVoices()}document.querySelector('#beep').onclick=async()=>{try{let c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=660;g.gain.value=.13;o.start();o.stop(c.currentTime+.4);await c.resume();log('Pipelyd forsøkt avspilt. Hørte du den?')}catch(e){log('Pipelyd FEIL: '+e.message)}};let utter;function test(lang,text){if(!('speechSynthesis'in window)){log('SpeechSynthesis mangler');return}speechSynthesis.cancel();let vs=voices(),base=lang.split('-')[0],v=vs.find(v=>v.lang.toLowerCase()===lang.toLowerCase())||vs.find(v=>v.lang.toLowerCase().startsWith(base));log('Språk: '+lang+' | stemmer funnet totalt: '+vs.length+' | passende: '+(v?v.name:'ingen'));utter=new SpeechSynthesisUtterance(text);utter.lang=lang;if(v)utter.voice=v;utter.onstart=()=>log('Tale STARTET');utter.onend=()=>log('Tale FERDIG');utter.onerror=e=>log('Tale FEIL: '+e.error);speechSynthesis.speak(utter);setTimeout(()=>log('Status etter 2 sek: speaking='+speechSynthesis.speaking+', pending='+speechSynthesis.pending),2000)}document.querySelector('#nor').onclick=()=>test('nb-NO','Velkommen til Arctic AI Guide. Dette er en lydtest.');document.querySelector('#eng').onclick=()=>test('en-US','Welcome to Arctic AI Guide. This is a sound test.');document.querySelector('#ger').onclick=()=>test('de-DE','Willkommen bei Arctic AI Guide. Dies ist ein Audiotest.');document.querySelector('#chi').onclick=()=>test('zh-CN','欢迎使用北极人工智能导览。');if('speechSynthesis'in window){log('Tilgjengelige stemmer: '+voices().length);speechSynthesis.addEventListener('voiceschanged',()=>log('Stemmer oppdatert: '+voices().length))}else log('Tale-API finnes ikke');</script></html>
